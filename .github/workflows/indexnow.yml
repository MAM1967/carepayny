name: IndexNow (Bing, ChatGPT search)

# After each push to main, wait for Cloudflare to deploy it, then tell IndexNow
# (Bing and partners) which pages are new or changed. ChatGPT search uses Bing's
# index. Google ignores IndexNow and reads the sitemap instead.
# See scripts/indexnow.mjs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Send every page in the sitemap, not just changed ones"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # First, before Cloudflare finishes deploying, keep a copy of the live sitemap to compare against.
      - name: Save the live sitemap
        run: node scripts/indexnow.mjs snapshot

      - run: npm ci
      - run: npm run build

      - name: List changed guide files in this push
        if: github.event_name == 'push'
        run: |
          echo "CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'src/content/**/*.md' 2>/dev/null | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Send changed pages to IndexNow
        run: node scripts/indexnow.mjs submit ${{ inputs.all && '--all' || '' }}
